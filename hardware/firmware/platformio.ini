; 参谋电报机：USB 双向声卡（INMP441 + MAX98357A）+ CDC（ESP-IDF）
; 两块 XIAO 同一份代码，按角色编译：pio run -e base（主箱）/ pio run -e handset（手柄）
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200

[env:base]
build_flags = -DTELEGRAPH_ROLE=1

[env:handset]
build_flags = -DTELEGRAPH_ROLE=2
