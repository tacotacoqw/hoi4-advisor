<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d30"/><stop offset="1" stop-color="#17180f"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4dc9c"/><stop offset=".55" stop-color="#e2c47c"/><stop offset="1" stop-color="#9c8550"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/><stop offset="1" stop-color="#2e1d10"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <!-- macOS 图标栅格：824 底板，四周留 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="128" y="128" width="768" height="768" rx="160" fill="none" stroke="#9c8550" stroke-width="10" opacity=".8"/>
  <g fill="#9c8550" opacity=".9">
    <circle cx="190" cy="190" r="14"/><circle cx="834" cy="190" r="14"/><circle cx="190" cy="834" r="14"/><circle cx="834" cy="834" r="14"/>
  </g>
  <!-- 摩尔斯电码「参谋」的意思：· · — -->
  <g fill="url(#brass)">
    <circle cx="372" cy="292" r="34"/><circle cx="470" cy="292" r="34"/><rect x="540" y="258" width="132" height="68" rx="34"/>
  </g>
  <!-- 电报键 -->
  <g filter="url(#sh)">
    <rect x="232" y="640" width="560" height="110" rx="26" fill="url(#wood)"/>
    <rect x="232" y="640" width="560" height="22" rx="11" fill="#7a5233" opacity=".7"/>
    <rect x="300" y="590" width="70" height="60" rx="10" fill="url(#brass)"/>
    <rect x="660" y="600" width="56" height="50" rx="10" fill="url(#brass)"/>
    <path d="M318 560 L708 470 L716 506 L326 596 Z" fill="url(#brass)"/>
    <circle cx="335" cy="578" r="30" fill="#9c8550"/><circle cx="335" cy="578" r="12" fill="#3a3d30"/>
    <rect x="700" y="452" width="34" height="70" rx="8" fill="#9c8550" transform="rotate(-13 717 487)"/>
    <ellipse cx="760" cy="438" rx="78" ry="30" fill="#1d1b17"/>
    <rect x="682" y="408" width="156" height="32" rx="16" fill="#2b2822"/>
    <ellipse cx="760" cy="408" rx="78" ry="28" fill="#3a3630"/>
  </g>
</svg>
